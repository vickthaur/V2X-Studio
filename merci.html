<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a4466">
  <title>Merci — V2X Studio</title>

  <link rel="icon" href="/favicon.ico" sizes="any">

  <style>
    :root {
      --bg: #ffffff;
      --ink: #1d1d1f;
      --muted: #86868b;
      --surface: #f9f9f9;
      --brand: #0a4466;
      --brand-light: #136e99;
      --shadow-lg: 0 16px 40px rgba(0,0,0,0.15);
      --radius: 24px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --surface: #1a1a1c;
        --shadow-lg: 0 16px 40px rgba(0,0,0,0.4);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; transition: all 0.2s ease; }
    a:hover { color: var(--brand); }

    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .container { width: min(760px, 100%); }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 48px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .logo {
      width: 80px;
      height: auto;
      margin: 0 auto 24px;
      display: block;
      opacity: 0.95;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.15));
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .recap {
      display: grid;
      gap: 16px;
      margin: 32px 0;
      padding: 24px;
      background: rgba(10, 68, 102, 0.05);
      border-radius: 16px;
      text-align: left;
      font-size: 14px;
    }

    .recap b { display: block; color: var(--ink); margin-bottom: 4px; }
    .recap div { color: var(--muted); margin-bottom: 12px; }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 32px 0 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 980px;
      font-weight: 600;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn.primary {
      background: var(--brand);
      color: white;
    }
    .btn.primary:hover { background: var(--brand-light); transform: translateY(-2px); }

    .btn.ghost {
      background: var(--surface);
      border: 1px solid var(--muted);
      color: var(--ink);
    }
    .btn.ghost:hover { border-color: var(--brand); color: var(--brand); }

    hr {
      border: none;
      height: 1px;
      background: var(--muted);
      opacity: 0.2;
      margin: 32px 0;
    }

    .tip {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    footer {
      color: var(--muted);
      padding: 24px 0;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .card { padding: 40px 24px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <section class="card">
        <img class="logo" src="image/V2XSTUDIO.webp" alt="V2X Studio">
        
        <h1>Merci <span id="who"></span>!</h1>
        <p class="lead">Votre demande a bien été envoyée. Je reviens vers vous sous 24h ouvrées.</p>

        <div class="recap" id="recap" hidden>
          <div><b>📧 Email</b><span id="mail"></span></div>
        </div>

        <div class="actions">
          <a class="btn primary" href="index.html#contact">Envoyer un autre message</a>
          <a class="btn ghost" href="index.html#prix">Voir les tarifs</a>
        </div>

        <hr>

        <p class="tip">
          💡 <strong>Astuce :</strong> Ajoutez <strong>victor.2xstudio@gmail.com</strong> à vos contacts pour éviter que ma réponse n'arrive dans les spams.
        </p>
      </section>
    </div>
  </main>

  <footer>
    © <span id="year"></span> V2X Studio — Tous droits réservés
  </footer>

  <script>
    // Update year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Get URL params
    const params = new URLSearchParams(location.search);
    const nom = (params.get('nom') || '').trim();
    const email = (params.get('email') || '').trim();

    // Display first name if available
    if (nom) {
      const firstName = nom.split(' ')[0];
      document.getElementById('who').textContent = firstName;
    }

    // Display recap if email present
    if (email) {
      document.getElementById('recap').hidden = false;
      document.getElementById('mail').textContent = email;
    }
  </script>
</body>
</html>
